name: Build FamiDrive-MD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NES ROMs for Mega Drive
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract all NES ROMs from ZIP
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("roms/test.nes.zip")
          if not archive_path.is_file():
              raise SystemExit(f"Missing {archive_path}; commit the ROM archive so Actions can access it.")

          output_dir = Path("roms/ci-inputs")
          output_dir.mkdir(parents=True, exist_ok=True)
          for old_rom in output_dir.glob("*.nes"):
              old_rom.unlink()

          ines_magic = bytes((0x4E, 0x45, 0x53, 0x1A))
          with ZipFile(archive_path) as archive:
              entries = [
                  info for info in archive.infolist()
                  if not info.is_dir() and info.filename.lower().endswith(".nes")
              ]
              if not entries:
                  raise SystemExit(f"No .nes files found in {archive_path}.")

              built_inputs = 0
              for info in entries:
                  data = archive.read(info)
                  if data[:4] != ines_magic:
                      print(f"Skipping {info.filename}: missing iNES header magic.")
                      continue

                  built_inputs += 1
                  member_name = info.filename.rsplit("/", 1)[-1]
                  stem = Path(member_name).stem
                  safe_stem = re.sub(r"[^A-Za-z0-9._-]+", "_", stem).strip("._")
                  if not safe_stem:
                      safe_stem = "rom"
                  target = output_dir / f"{built_inputs:02d}_{safe_stem}.nes"
                  target.write_bytes(data)
                  print(f"Extracted {info.filename} -> {target}")

              if built_inputs == 0:
                  raise SystemExit("No valid iNES ROMs found in the ZIP archive.")
          PY

      - name: Build each ROM with FPS counter
        shell: bash
        run: |
          shopt -s nullglob
          roms=(roms/ci-inputs/*.nes)
          if (( ${#roms[@]} == 0 )); then
            echo "No .nes files were extracted." >&2
            exit 1
          fi

          mkdir -p out/roms
          for rom in "${roms[@]}"; do
            name="$(basename "$rom" .nes)"
            echo "Building $rom with recompiler and FPS counter"
            bash ./build.sh --recompile --fps "$rom"
            cp out/rom_md.bin "out/roms/${name}.bin"
            cp out/rom_md.bin "out/roms/${name}.md"
            cp out/rom_md.lst "out/roms/${name}.lst"
          done

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: famidrive-md-builds-${{ github.sha }}
          path: out/roms/
          if-no-files-found: error
          retention-days: 14
