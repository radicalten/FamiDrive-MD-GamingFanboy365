name: Build FamiDrive-MD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NES ROMs for Mega Drive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract supported NES ROMs from roms/
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from zipfile import BadZipFile, ZipFile

          roms_dir = Path("roms")
          archives = sorted(roms_dir.glob("*.zip"))
          loose = sorted(roms_dir.glob("*.nes"))
          if not archives and not loose:
              raise SystemExit(
                  "Missing roms/*.zip or roms/*.nes; commit the ROM archive so Actions can access it."
              )

          output_dir = Path("roms/ci-inputs")
          output_dir.mkdir(parents=True, exist_ok=True)
          for stale in output_dir.iterdir():
              if stale.is_file():
                  stale.unlink()

          # What md.asm (Fami_LoadRom), tools/nesinfo.py and tools/recomp6502.py agree on:
          # mappers 0 (NROM), 2 (UxROM), 3 (CNROM) and 4 (MMC3), with 16 or 32 KB of PRG-ROM
          # unless the mapper is banked (2 and 4, which lay out a 32 KB image per 16 KB bank,
          # so 32 KB to 512 KB). CHR-ROM and CHR-RAM both work.
          mapper_names = {0: "NROM", 2: "UxROM", 3: "CNROM", 4: "MMC3"}
          banked = (2, 4)

          ines_magic = bytes((0x4E, 0x45, 0x53, 0x1A))
          candidates = []
          for archive_path in archives:
              try:
                  with ZipFile(archive_path) as archive:
                      for info in archive.infolist():
                          parts = info.filename.split("/")
                          if info.is_dir() or not info.filename.lower().endswith(".nes"):
                              continue
                          if "__MACOSX" in parts or parts[-1].startswith("._"):
                              continue  # macOS metadata, not a ROM
                          candidates.append(
                              (f"{archive_path.name}:{info.filename}", archive.read(info))
                          )
              except BadZipFile:
                  raise SystemExit(f"{archive_path} is not a ZIP file.")
          for path in loose:
              candidates.append((str(path), path.read_bytes()))

          def read_mapper(data):
              """The mapper number as recomp6502.py, tools/nesinfo.py and md.asm read it: old dumps
              can have junk (e.g. "DiskDude!") in bytes 7-15, ignored unless it's NES 2.0."""
              mapper_high = data[7] & 0xF0
              if data[7] & 0x0C != 0x08 and any(data[12:16]):
                  mapper_high = 0
              return (data[6] >> 4) | mapper_high

          def reject(label, data):
              """Why FamiDrive can't build this ROM, or None if it can."""
              if len(data) < 16 or data[:4] != ines_magic:
                  return "not a complete iNES ROM"
              if data[6] & 0x04:
                  return "it has a 512-byte trainer, and Fami_LoadRom reads PRG-ROM from offset 16"
              mapper = read_mapper(data)
              if mapper not in mapper_names:
                  return f"mapper {mapper} is unsupported (FamiDrive runs mappers 0, 2, 3 and 4)"
              prg16, chr8 = data[4], data[5]
              if mapper in banked:
                  if not 2 <= prg16 <= 32:
                      return (
                          f"mapper {mapper} ({mapper_names[mapper]}) needs 32 KB to 512 KB of "
                          f"PRG-ROM, not {prg16 * 16} KB"
                      )
              elif prg16 not in (1, 2):
                  return (
                      f"mapper {mapper} ({mapper_names[mapper]}) needs 16 KB or 32 KB of "
                      f"PRG-ROM, not {prg16 * 16} KB"
                  )
              if len(data) < 16 + prg16 * 0x4000 + chr8 * 0x2000:
                  return (
                      f"it is truncated: {len(data)} bytes, but its header says "
                      f"{prg16 * 16} KB of PRG-ROM and {chr8 * 8} KB of CHR-ROM"
                  )
              return None

          accepted, skipped = [], []
          for label, data in candidates:
              reason = reject(label, data)
              if reason:
                  skipped.append((label, reason))
                  print(f"Skipping {label}: {reason}")
                  print(f"::warning title=Skipped ROM::{label}: {reason}")
                  continue
              accepted.append((label, read_mapper(data), data[4], data[5], data))

          if not accepted:
              raise SystemExit("No supported iNES ROMs found (FamiDrive runs mappers 0, 2, 3 and 4).")

          plan = []
          for index, (label, mapper, prg16, chr8, data) in enumerate(sorted(accepted), start=1):
              member_name = Path(label.rsplit(":", 1)[-1]).stem
              safe_stem = re.sub(r"[^A-Za-z0-9._-]+", "_", member_name).strip("._")
              name = f"{index:02d}_{safe_stem or 'rom'}"
              target = output_dir / f"{name}.nes"
              target.write_bytes(data)
              plan.append((name, label, mapper, prg16, chr8))
              chr_text = f"CHR-ROM {chr8 * 8} KB" if chr8 else "CHR-RAM"
              print(
                  f"Extracted {label} -> {target} (mapper {mapper} {mapper_names[mapper]}, "
                  f"PRG-ROM {prg16 * 16} KB, {chr_text})"
              )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as out:
                  out.write(f"### ROMs from {', '.join(a.name for a in archives) or 'roms/'}\n\n")
                  out.write("| ROM | Mapper | PRG-ROM | CHR-ROM |\n| --- | --- | --- | --- |\n")
                  for name, label, mapper, prg16, chr8 in plan:
                      chr_text = f"{chr8 * 8} KB" if chr8 else "RAM"
                      out.write(
                          f"| `{label}` | {mapper} ({mapper_names[mapper]}) | "
                          f"{prg16 * 16} KB | {chr_text} |\n"
                      )
                  if skipped:
                      out.write("\nSkipped:\n\n")
                      for label, reason in skipped:
                          out.write(f"- `{label}`: {reason}\n")
                  out.write("\n")
          PY

      - name: Build each ROM with FPS counter
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          roms=(roms/ci-inputs/*.nes)
          if (( ${#roms[@]} == 0 )); then
            echo "No .nes files were extracted." >&2
            exit 1
          fi

          # A forward branch or call to a label further on must have an explicit size (`bsr.w`,
          # `jsr (label).l`): AS takes it as short in its first pass, and if the code grows, a
          # short forward branch fails with "jump distance too big" (see CLAUDE.md). Upstream
          # fixed the one in emu/fps.asm, so builds usually pass as they are; if one doesn't,
          # pin the remaining unsized ones and try again rather than failing the whole run.
          normalize_bsr() {
            python3 - <<'PY'
          import re
          from pathlib import Path

          for asm_path in sorted(Path("emu").glob("*.asm")):
              asm_text = asm_path.read_text()
              fixed = re.sub(r"^(\s*bsr)\t", r"\1.w\t", asm_text, flags=re.M)
              fixed = re.sub(r"\bbsr\.s(\s+\.(?:hide|links))\b", r"bsr.w\1", fixed)
              if fixed != asm_text:
                  asm_path.write_text(fixed)
                  print(f"Pinned forward bsr sizes in {asm_path}")
          PY
          }

          mkdir -p out/roms
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### Builds"
            echo
            echo "| ROM | Mapper | Mega Drive ROM |"
            echo "| --- | --- | --- |"
          } >> "$summary"

          failed=0
          for rom in "${roms[@]}"; do
            name="$(basename "$rom" .nes)"
            log="$(mktemp)"
            echo "::group::Building $name (recompiled, with FPS counter)"
            rm -f out/rom_md.bin out/rom_md.lst out/nes_info.asm

            built=1
            bash ./build.sh --recompile --fps "$rom" 2>&1 | tee "$log" || built=0
            if (( built == 0 )) && grep -qE "jump distance too big|addressing mode not allowed" "$log"; then
              echo "Assembler pass sizing failed; retrying $name with explicit branch sizes" >&2
              normalize_bsr
              built=1
              bash ./build.sh --recompile --fps "$rom" || built=0
            fi

            if (( built == 1 )) && [[ -f out/rom_md.bin ]]; then
              cp out/rom_md.bin "out/roms/${name}.bin"
              cp out/rom_md.bin "out/roms/${name}.md"
              cp out/rom_md.lst "out/roms/${name}.lst"
              mapper="$(awk '/^NES_MAPPER/ {print $3}' out/nes_info.asm)"
              size="$(stat -c %s out/rom_md.bin)"
              echo "Built out/roms/${name}.md: $(numfmt --to=iec "$size"), mapper ${mapper}"
              echo "| \`${name}\` | ${mapper} | $(numfmt --to=iec "$size") |" >> "$summary"
            else
              echo "::error title=Build failed::${name} did not build; see the log above"
              echo "| \`${name}\` | | **failed** |" >> "$summary"
              failed=$(( failed + 1 ))
            fi

            rm -f "$log"
            echo "::endgroup::"
          done

          # out/recomp.asm is the game's own code, translated: never upload it
          rm -f out/recomp.asm

          if (( failed > 0 )); then
            echo "::error::${failed} of ${#roms[@]} ROM(s) did not build."
            exit 1
          fi
          echo "Built ${#roms[@]} ROM(s)."

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: famidrive-md-builds-${{ github.sha }}
          path: out/roms/
          if-no-files-found: error
          retention-days: 14
