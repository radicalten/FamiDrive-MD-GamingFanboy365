name: Build FamiDrive-MD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mega Drive ROM
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract test NES ROM
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("roms/test.nes.zip")
          if not archive_path.is_file():
              raise SystemExit(f"Missing {archive_path}; commit the ROM archive so Actions can access it.")

          with ZipFile(archive_path) as archive:
              entries = [
                  name for name in archive.namelist()
                  if name.lower().endswith(".nes") and not name.endswith("/")
              ]
              # Prefer the member named test.nes, even if the ZIP contains other ROMs.
              matches = [
                  name for name in entries
                  if name.rsplit("/", 1)[-1].casefold() == "test.nes"
              ]
              if len(matches) == 1:
                  selected = matches[0]
              elif not matches and len(entries) == 1:
                  # If the ZIP has only one ROM, use it regardless of its internal filename.
                  selected = entries[0]
              else:
                  raise SystemExit(
                      "Could not uniquely select test.nes from the archive. "
                      f"NES files found: {entries}"
                  )
              Path("roms/test.nes").write_bytes(archive.read(selected))
          PY

      - name: Build Mega Drive ROM
        run: bash ./build.sh roms/test.nes

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: famidrive-md-build-${{ github.sha }}
          path: |
            out/rom_md.bin
            out/rom_md.lst
          if-no-files-found: error
          retention-days: 14
