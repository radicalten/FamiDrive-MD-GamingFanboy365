name: Build FamiDrive-MD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NES ROMs for Mega Drive
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract all NES ROMs from ZIP
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("roms/test.nes.zip")
          if not archive_path.is_file():
              raise SystemExit(f"Missing {archive_path}; commit the ROM archive so Actions can access it.")

          output_dir = Path("roms/ci-inputs")
          output_dir.mkdir(parents=True, exist_ok=True)
          for old_rom in output_dir.glob("*.nes"):
              old_rom.unlink()

          ines_magic = bytes((0x4E, 0x45, 0x53, 0x1A))
          with ZipFile(archive_path) as archive:
              entries = [
                  info for info in archive.infolist()
                  if not info.is_dir() and info.filename.lower().endswith(".nes")
              ]
              if not entries:
                  raise SystemExit(f"No .nes files found in {archive_path}.")

              built_inputs = 0
              for info in entries:
                  data = archive.read(info)
                  if len(data) < 16 or data[:4] != ines_magic:
                      print(f"Skipping {info.filename}: not a complete iNES ROM.")
                      continue

                  # Match recomp6502.py and md.asm's header checks. FPS/recompile mode
                  # supports mapper 0 (NROM) and mapper 3 (CNROM) with 1 or 2 16 KB PRG banks.
                  mapper_high = data[7] & 0xF0
                  if data[7] & 0x0C != 0x08 and any(data[12:16]):
                      mapper_high = 0  # tolerate junk in old iNES headers
                  mapper = (data[6] >> 4) | mapper_high
                  if mapper not in (0, 3):
                      print(f"Skipping {info.filename}: mapper {mapper} is unsupported; use mapper 0 or 3 for FPS builds.")
                      continue

                  prg_banks = data[4]
                  if prg_banks not in (1, 2) or len(data) < 16 + prg_banks * 0x4000:
                      print(f"Skipping {info.filename}: unsupported or truncated PRG-ROM size ({prg_banks} x 16 KB).")
                      continue

                  built_inputs += 1
                  member_name = info.filename.rsplit("/", 1)[-1]
                  stem = Path(member_name).stem
                  safe_stem = re.sub(r"[^A-Za-z0-9._-]+", "_", stem).strip("._")
                  if not safe_stem:
                      safe_stem = "rom"
                  target = output_dir / f"{built_inputs:02d}_{safe_stem}.nes"
                  target.write_bytes(data)
                  print(f"Extracted {info.filename} -> {target}")

              if built_inputs == 0:
                  raise SystemExit("No supported iNES ROMs found (FPS builds require mapper 0 or 3).")
          PY

      - name: Normalize forward BSR widths for ASL multi-pass FPS builds
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # Commit 5982d73 added `bsr.s .hide` in emu/fps.asm 4 bytes before `.hide:`.
          # When unsuffixed forward `bsr` instructions in emu/*.asm expand between ASL
          # Pass 2 and Pass 3 (+6 bytes, or +4 bytes after `align 4` in out/recomp.asm),
          # Pass 3 sees a temporary 0-byte displacement at `bsr.s .hide` and fails with
          # `fps.asm(115): error: jump distance too big`. Pinning these to `bsr.w` keeps
          # pass sizes stable.
          fps_path = Path("emu/fps.asm")
          if fps_path.is_file():
              fps_text = fps_path.read_text()
              fps_text = re.sub(r"\bbsr\.s(\s+\.(?:hide|links))\b", r"bsr.w\1", fps_text)
              fps_path.write_text(fps_text)

          for asm_name in ("emu/ppu.asm", "emu/apu.asm", "emu/memory.asm"):
              asm_path = Path(asm_name)
              if asm_path.is_file():
                  asm_text = asm_path.read_text()
                  asm_text = re.sub(r"^(\s*bsr)\t", r"\1.w\t", asm_text, flags=re.M)
                  asm_path.write_text(asm_text)
          PY

      - name: Build each ROM with FPS counter
        shell: bash
        run: |
          shopt -s nullglob
          roms=(roms/ci-inputs/*.nes)
          if (( ${#roms[@]} == 0 )); then
            echo "No .nes files were extracted." >&2
            exit 1
          fi

          mkdir -p out/roms
          for rom in "${roms[@]}"; do
            name="$(basename "$rom" .nes)"
            echo "Building $rom with recompiler and FPS counter"
            bash ./build.sh --recompile --fps "$rom"
            cp out/rom_md.bin "out/roms/${name}.bin"
            cp out/rom_md.bin "out/roms/${name}.md"
            cp out/rom_md.lst "out/roms/${name}.lst"
          done

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: famidrive-md-builds-${{ github.sha }}
          path: out/roms/
          if-no-files-found: error
          retention-days: 14
