name: Build FamiDrive-MD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mega Drive ROM
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract test NES ROM
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("roms/test.nes.zip")
          if not archive_path.is_file():
              raise SystemExit(f"Missing {archive_path}; commit the ROM archive so Actions can access it.")

          with ZipFile(archive_path) as archive:
              entries = [
                  name for name in archive.namelist()
                  if name.lower().endswith(".nes") and not name.endswith("/")
              ]
              if len(entries) != 1:
                  raise SystemExit(
                      f"Expected exactly one .nes file in {archive_path}, found {len(entries)}."
                  )
              Path("roms/test.nes").write_bytes(archive.read(entries[0]))
          PY

      - name: Build Mega Drive ROM
        run: bash ./build.sh roms/test.nes

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: famidrive-md-build-${{ github.sha }}
          path: |
            out/rom_md.bin
            out/rom_md.lst
          if-no-files-found: error
          retention-days: 14
